[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "skvoice"
dynamic = ["version"]
description = "Sovereign Voice Agent Service for SKCapstone"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "httpx>=0.25",
    "websockets>=12.0",
    # NOTE: "anthropic>=0.40" was dropped in the same change that deleted
    # skvoice/tools.py. The SDK path was retired in v0.2.6 (llm.py speaks plain
    # OpenAI-compatible /v1/chat/completions over httpx) and nothing has
    # imported the package since: `grep -rni anthropic skvoice/` returns only
    # a prose mention in llm.py's docstring.
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
skcapstone = ["skcapstone>=0.6.8"]
# publish.yml has always run `pip install -e ".[dev]" || pip install -e .`, but
# this extra did not exist: the first half always failed, the fallback installed
# no pytest, and the test step died on "No module named pytest" into a
# continue-on-error that swallowed it. The suite had never run in CI.
dev = ["pytest>=7"]

[project.scripts]
skvoice = "skvoice.__main__:main"

[tool.setuptools.packages.find]
include = ["skvoice*"]

[tool.setuptools_scm]
version_file = "skvoice/_version.py"
fallback_version = "0.0.0+unknown"
